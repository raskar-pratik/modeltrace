version: "3.9"

services:
  modeltrace:
    build: .
    container_name: modeltrace-local
    # Strictly bind only to host 127.0.0.1 loopback interface
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./exports:/app/exports
    env_file:
      - .env
    restart: unless-stopped
